<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kawakun TikTok Autopost Callback</title>
<style>
  body {
    background: #f7f5f0;
    color: #241f19;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 4rem 1.5rem;
    line-height: 1.6;
  }
  .page { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  code {
    display: block;
    background: #fff;
    border: 1px solid #e5dfd2;
    border-radius: 6px;
    padding: 1rem;
    word-break: break-all;
    font-size: 0.95rem;
    margin: 1rem 0;
  }
  .muted { color: #6f6355; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="page">
  <h1>認可コード</h1>
  <p>この画面に表示された <code id="code">(取得中...)</code> の中身を、投稿スクリプトの初回セットアップ時に貼り付けてください。</p>
  <p class="muted">このページは一時的な受け皿です。コードは発行から短時間で失効するため、すぐにコピーしてください。</p>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");
  document.getElementById("code").textContent = code ? code : (error ? "エラー: " + error : "コードが見つかりませんでした");
</script>
</body>
</html>
